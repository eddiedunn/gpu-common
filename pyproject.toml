[project]
name = "gpu-common"
version = "0.3.0"
description = "Shared GPU utilities for AI services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
# PyTorch services get CUDA cache release; ONNX Runtime / CTranslate2 services can skip it.
torch = ["torch>=2.0.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_common"]
